name: Daily digest

on:
  schedule:
    # Расписание GitHub ненадёжно: запуски опаздывают и пропускаются. Поэтому запусков
    # несколько (каждые 30 минут с 04:23 до 09:53 UTC); первый, попавший в окно после
    # 06:00 по Амстердаму, публикует дайджест, остальные завершаются за секунды.
    # Основной триггер — внешний планировщик (cron-job.org), см. README.
    - cron: "23,53 4-9 * * *"
  repository_dispatch:
    # Внешний планировщик (cron-job.org) вызывает этот тип события — см. README.
    types: [daily-digest]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Пробный прогон: только показать дайджест в Summary, ничего не отправлять"
        type: boolean
        default: true
      force:
        description: "Опубликовать сейчас, даже если сегодня уже публиковали"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: bot-state
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build and post
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          POST_HOUR: ${{ vars.POST_HOUR }}
          POST_UNTIL_HOUR: ${{ vars.POST_UNTIL_HOUR }}
          NEWS_WINDOW_HOURS: ${{ vars.NEWS_WINDOW_HOURS }}
          EVENT_HORIZON_DAYS: ${{ vars.EVENT_HORIZON_DAYS }}
          MAX_NEWS: ${{ vars.MAX_NEWS }}
          MAX_EVENTS: ${{ vars.MAX_EVENTS }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run";
          elif [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          python -m bot digest $ARGS

      - name: Save state
        if: always()
        run: |
          git config user.name "delft-news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- state 2>/dev/null || true
          git add -A -- preview 2>/dev/null || true
          if git diff --cached --quiet; then echo "state unchanged"; exit 0; fi
          git commit -m "state: digest $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
          exit 1

      - name: Keep schedules enabled
        # GitHub отключает расписание в публичных репозиториях после 60 дней без активности.
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/digest.yml/enable" || true

      - name: Alert admin on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
        run: |
          [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$ADMIN_CHAT_ID" ] || exit 0
          curl -s -o /dev/null -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${ADMIN_CHAT_ID}" \
            --data-urlencode "text=⚠️ Сбой «${{ github.workflow }}». Подробности: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

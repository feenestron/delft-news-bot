name: Diagnose sources
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch feeds and pages
        run: |
          UA="DelftNewsDigestBot/1.0 (+https://github.com/feenestron/delft-news-bot)"
          for u in https://www.omroepdelft.nl/feed/ https://www.omroepdelft.nl/ https://www.delft.nl/nieuws https://www.delft.nl/robots.txt https://www.omroepdelft.nl/robots.txt; do
            echo "===== $u"
            curl -sS -A "$UA" -o /tmp/p -w "HTTP %{http_code} size %{size_download} type %{content_type}\n" -L "$u" || true
            if echo "$u" | grep -q feed; then grep -o "<lastBuildDate>[^<]*" /tmp/p; grep -o "<pubDate>[^<]*" /tmp/p | head -5; grep -o "<title>[^<]*" /tmp/p | head -6; fi
            if echo "$u" | grep -q robots; then cat /tmp/p | head -40; fi
            if echo "$u" | grep -q "delft.nl/nieuws"; then grep -oE 'href="/[a-z0-9-]+"' /tmp/p | head -20; grep -oiE '[0-9]{1,2} (oktober|november) 2026' /tmp/p | head -10; fi
            if [ "$u" = "https://www.omroepdelft.nl/" ]; then grep -oiE '(maandag|dinsdag|woensdag|donderdag|vrijdag|zaterdag|zondag) [0-9]{1,2} (oktober|november) 2026' /tmp/p | head -5; fi
          done
